# DroidStar ADN: compila la APK Android (arm64) y, al empujar un tag adn-<versión>-<versionCode>,
# la firma y la sube a la release de ese tag. A mano (workflow_dispatch) deja la APK como artefacto.
name: DroidStar ADN Android

on:
  push:
    tags: ['adn-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qt 6.8.3 (Android arm64 + host)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia qtserialport
          autodesktop: true
          cache: true

      - name: NDK y OpenSSL para Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          # CMakeLists.txt incluye ~/Android/Sdk/android_openssl/android_openssl.cmake
          mkdir -p ~/Android/Sdk
          git clone -q --depth 1 https://github.com/KDAB/android_openssl.git ~/Android/Sdk/android_openssl

      - name: versionCode del tag
        if: startsWith(github.ref, 'refs/tags/adn-')
        run: |
          code="${GITHUB_REF_NAME##*-}"
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "el tag debe acabar en -<versionCode>"; exit 1; }
          sed -i "s/QT_ANDROID_VERSION_CODE [0-9]*/QT_ANDROID_VERSION_CODE $code/" CMakeLists.txt
          grep -n QT_ANDROID_VERSION_CODE CMakeLists.txt

      - name: Compilar
        run: |
          sudo apt-get install -y -qq ninja-build > /dev/null
          export ANDROID_SDK_ROOT="$ANDROID_HOME" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(realpath "$QT_ROOT_DIR/../gcc_64")" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build --parallel
          cmake --build build --target apk

      - name: Firmar
        env:
          KEYSTORE_B64: ${{ secrets.ADN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ADN_KEYSTORE_PASSWORD }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find build -name '*-release-unsigned.apk' | head -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$bt/zipalign" -f -p 4 "$unsigned" aligned.apk
          code=$(grep -o 'QT_ANDROID_VERSION_CODE [0-9]*' CMakeLists.txt | cut -d' ' -f2)
          out="DroidStar-ADN-${GITHUB_REF_NAME#adn-}-arm64.apk"
          [[ "$GITHUB_REF" == refs/tags/* ]] || out="DroidStar-ADN-${code}-${GITHUB_SHA::7}-arm64.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias droidstar-adn --ks-pass env:KS_PASS --out "$out" aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$bt/apksigner" verify --print-certs "$out" | head -2
          echo "APK=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Subir a la release del tag
        if: startsWith(github.ref, 'refs/tags/adn-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "DroidStar ADN ${GITHUB_REF_NAME#adn-}" \
              --notes "DroidStar ADN (ADN Pass). Ver README-ADN.md."
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
